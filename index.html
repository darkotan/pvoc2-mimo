<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PVOC Level 2 Exam Prep</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<style>
:root{--bg:#f0f4f8;--surface:#fff;--text:#1a202c;--text2:#64748b;--pri:#2563eb;--pri-l:#eff6ff;--ok:#16a34a;--ok-l:#f0fdf4;--bad:#dc2626;--bad-l:#fef2f2;--warn:#f59e0b;--bdr:#e2e8f0;--sh:0 1px 3px rgba(0,0,0,.08);--r:12px}
[data-theme=dark]{--bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--pri:#60a5fa;--pri-l:#1e3a5f;--ok:#4ade80;--ok-l:#14352a;--bad:#f87171;--bad-l:#3b1818;--warn:#fbbf24;--bdr:#334155;--sh:0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hl{display:flex;align-items:center;gap:8px}
.logo{font-size:24px}.hl h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.hr{display:flex;align-items:center;gap:6px}
select{padding:5px 8px;border-radius:6px;border:1px solid var(--bdr);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;outline:none}
.theme-btn{cursor:pointer;border:none;background:var(--bg);font-size:18px;padding:4px 8px;border-radius:6px;line-height:1}
main{max-width:640px;margin:0 auto;padding:16px 12px 80px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card-t{font-size:16px;font-weight:600;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:8px;font-size:15px;font-weight:600;text-align:center;cursor:pointer;border:none;transition:.2s;text-decoration:none}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{opacity:.85}
.btn-o{background:transparent;border:2px solid var(--bdr);color:var(--text)}.btn-o:hover{border-color:var(--pri);color:var(--pri)}
.btn-b{display:block;width:100%}
.btn-s{padding:8px 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opt{display:block;padding:12px 14px;margin-bottom:8px;border:2px solid var(--bdr);border-radius:10px;cursor:pointer;transition:.15s;font-size:14.5px;line-height:1.5}
.opt:hover:not(.dis){border-color:var(--pri);background:var(--pri-l)}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--bad);background:var(--bad-l)}
.opt.dis{pointer-events:none}
.opt .ltr{font-weight:700;margin-right:6px}
.pbar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:8px 0}
.pfill{height:100%;background:var(--pri);transition:width .3s;border-radius:3px}
.timer{font-size:22px;font-weight:700;color:var(--pri);text-align:center;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.tag-ch{background:var(--pri-l);color:var(--pri)}
.tag-src{background:var(--ok-l);color:var(--ok)}
.exp-box{margin-top:12px;padding:12px 14px;background:var(--pri-l);border-radius:8px;border-left:3px solid var(--pri);font-size:14px;line-height:1.6}
.q-img{max-width:100%;max-height:260px;border-radius:8px;margin:10px 0;display:block;object-fit:contain;background:#fff}
.score{font-size:56px;font-weight:800;text-align:center;margin:20px 0}
.score.p{color:var(--ok)}.score.f{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mbtn{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border-radius:var(--r);margin-bottom:8px;cursor:pointer;border:2px solid var(--bdr);transition:.2s;text-decoration:none;color:var(--text)}
.mbtn:hover{border-color:var(--pri);transform:translateY(-1px);box-shadow:var(--sh)}
.mi{font-size:28px;flex-shrink:0}
.mt{font-weight:600;font-size:15px}.md{font-size:13px;color:var(--text2);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}
.sn{font-size:24px;font-weight:700;color:var(--pri)}.sl{font-size:12px;color:var(--text2)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.qnav .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--pri);font-size:14px;cursor:pointer;margin-bottom:12px;background:none;border:none;font-weight:500}
.back:hover{text-decoration:underline}
.ri{padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--bdr);font-size:14px;line-height:1.5}
.ri.ok-r{border-left:3px solid var(--ok)}.ri.bad-r{border-left:3px solid var(--bad)}
.ch-item{padding:12px;margin-bottom:6px;border-radius:8px;border:1px solid var(--bdr);cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}
.ch-item:hover{border-color:var(--pri);background:var(--pri-l)}
.ch-name{font-weight:600;font-size:14px}.ch-cnt{font-size:13px;color:var(--text2)}
.center{text-align:center}.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.info-row{padding:8px 0;border-bottom:1px solid var(--bdr);font-size:14px}
.info-row:last-child{border-bottom:none}
@media(max-width:480px){header{padding:8px 10px}.hl h1{font-size:15px;max-width:130px}main{padding:12px 10px 80px}.grid{grid-template-columns:repeat(2,1fr)}.score{font-size:44px}}
.loading{text-align:center;padding:40px;color:var(--text2);font-size:15px}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--bdr);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--bdr);background:var(--surface);color:var(--text2);white-space:nowrap;transition:.2s}
.tab.act{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>

    // Transform exam A - data already has zh-CN/zh-TW/en fields
    const qa=ra.map((raw,i)=>{
      return{id:'a_'+(raw.qnum||i),src:'examA',ch:raw.ch,img:raw.img||null,
        q:raw.q, o:raw.o, a:raw.a,
        exp:raw.exp||{'zh-CN':'','zh-TW':'','en':''}
      };
    });
    // Transform exam B
    const qb=rb.map((raw,i)=>{
      return{id:'b_'+(raw.qnum||i),src:'examB',ch:raw.ch,img:raw.img||null,
        q:raw.q, o:raw.o, a:raw.a,
        exp:raw.exp||{'zh-CN':'','zh-TW':'','en':''}
      };
    });
    // Transform proprofs
    const qp=rp.map((raw,i)=>{
      return{id:'p_'+i,src:'proprofs',ch:raw.ch,img:raw.img||null,
        q:raw.q, o:raw.o, a:raw.a,
        exp:raw.exp||{'zh-CN':'','zh-TW':'','en':''}
      };
    });
    S.allQ=[...qa,...qb,...qp];
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="card center"><p>⚠️ ${t('loading')}</p><p style="font-size:13px;color:var(--text2);margin-top:8px">${e.message}</p></div>`;
  }
}

// ===================== RENDERING =====================
function render(){
  const m=document.getElementById('main');
  document.getElementById('langSel').value=S.lang;
  switch(S.view){
    case 'home':m.innerHTML=renderHome();break;
    case 'chSel':m.innerHTML=renderChSel();break;
    case 'examSel':m.innerHTML=renderExamSel();break;
    case 'q':m.innerHTML=renderQ();break;
    case 'results':m.innerHTML=renderResults();break;
    case 'review':m.innerHTML=renderReview();break;
    case 'info':m.innerHTML=renderInfo();break;
  }
  updateTitle();
}

function updateTitle(){document.getElementById('htitle').textContent=t('title')}

function renderHome(){
  const p=S.prog;
  let totAns=0,totCor=0;
  for(const k in p){if(p[k].attempts){totAns+=p[k].attempts;totCor+=p[k].correct}}
  const acc=totAns?Math.round(totCor/totAns*100):0;
  const wrongKeys=Object.keys(p).filter(k=>p[k].attempts&&p[k].correct/p[k].attempts<1);
  return `
  <div class="card">
    <div class="stats">
      <div><div class="sn">${totAns}</div><div class="sl">${t('sAns')}</div></div>
      <div><div class="sn">${totCor}</div><div class="sl">${t('sCor')}</div></div>
      <div><div class="sn">${acc}%</div><div class="sl">${t('acc')}</div></div>
    </div>
  </div>
  <div class="mbtn" onclick="nav('chSel')">
    <div class="mi">📖</div><div><div class="mt">${t('practice')}</div><div class="md">${t('selCh')}</div></div>
  </div>
  <div class="mbtn" onclick="nav('examSel')">
    <div class="mi">📝</div><div><div class="mt">${t('exam')}</div><div class="md">${t('partA')} / ${t('partB')}</div></div>
  </div>
  <div class="mbtn" onclick="nav('review')">
    <div class="mi">❌</div><div><div class="mt">${t('review')}</div><div class="md">${wrongKeys.length} ${t('q')}</div></div>
  </div>
  <div class="mbtn" onclick="nav('info')">
    <div class="mi">ℹ️</div><div><div class="mt">${t('info')}</div><div class="md">${t('examR')}</div></div>
  </div>`;
}

function renderChSel(){
  const lang=S.lang;
  // Count questions per chapter
  const cnt={};
  S.allQ.forEach(q=>{cnt[q.ch]=(cnt[q.ch]||0)+1});
  let h=`<button class="back" onclick="nav('home')">← ${t('back')}</button>`;
  h+=`<div class="card"><div class="card-t">${t('practice')}</div></div>`;
  // Part A chapters
  h+=`<div class="card"><div class="card-t" style="color:var(--pri);margin-bottom:4px">甲部 Part A</div>`;
  for(let i=1;i<=13;i++){
    const ch='ch'+i;
    if(!cnt[ch])continue;
    h+=`<div class="ch-item" onclick="startPractice('${ch}')"><span class="ch-name">${CH[ch][lang]}</span><span class="ch-cnt">${cnt[ch]} ${t('q')}</span></div>`;
  }
  h+=`</div>`;
  // Part B chapters
  h+=`<div class="card"><div class="card-t" style="color:var(--ok);margin-bottom:4px">乙部 Part B</div>`;
  for(let i=14;i<=22;i++){
    const ch='ch'+i;
    if(!cnt[ch])continue;
    h+=`<div class="ch-item" onclick="startPractice('${ch}')"><span class="ch-name">${CH[ch][lang]}</span><span class="ch-cnt">${cnt[ch]} ${t('q')}</span></div>`;
  }
  h+=`</div>`;
  // Practice all
  h+=`<button class="btn btn-p btn-b mb-16" onclick="startPractice('all')">${t('pAll')} (${S.allQ.length})</button>`;
  return h;
}

function renderExamSel(){
  let h=`<button class="back" onclick="nav('home')">← ${t('back')}</button>`;
  h+=`<div class="card"><div class="card-t">${t('exam')}</div></div>`;
  h+=`<div class="mbtn" onclick="startExam('A')"><div class="mi">🅰️</div><div><div class="mt">${t('partA')}</div><div class="md">${t('partAD')}</div></div></div>`;
  h+=`<div class="mbtn" onclick="startExam('B')"><div class="mi">🅱️</div><div><div class="mt">${t('partB')}</div><div class="md">${t('partBD')}</div></div></div>`;
  h+=`<div class="card" style="margin-top:16px"><div class="card-t">${t('examR')}</div>`;
  h+=`<div class="info-row">${t('rA')}</div><div class="info-row">${t('rB')}</div>`;
  h+=`<div class="info-row">${t('rC')}</div><div class="info-row">${t('rD')}</div></div>`;
  return h;
}

function renderQ(){
  const qs=S.curQ,i=S.idx,q=qs[i];
  if(!q)return `<div class="card center">${t('noBad')}</div>`;
  const lang=S.lang,p=S.done[q.id],prog=Math.round((i+1)/qs.length*100);
  let h=`<button class="back" onclick="exitPractice()">← ${t('back')}</button>`;
  // Timer for exam mode
  if(S.mode==='exam'){
    h+=`<div class="timer ${S.examLeft<=300?'warn':''}" id="timer">${fmt(S.examLeft)}</div>`;
  }
  // Progress bar
  h+=`<div class="pbar"><div class="pfill" style="width:${prog}%"></div></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:4px">
    <span>${t('answered')} ${i+1}/${qs.length}</span>
    <span class="tag tag-ch">${CH[q.ch]?CH[q.ch][lang]:q.ch}</span>
  </div>`;
  // Question card
  h+=`<div class="card">`;
  h+=`<div style="font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.6">${q.q[lang]||q.q['zh-TW']}</div>`;
  if(q.img)h+=`<img class="q-img" src="images/${q.img}" onerror="this.style.display='none'" loading="lazy">`;
  // Options
  q.o.forEach((opt,j)=>{
    let cls='opt';
    if(p){
      cls+=' dis';
      if(j===q.a)cls+=' ok';
      else if(j===p.sel&&j!==q.a)cls+=' bad';
    }else if(S.ans[q.id]===j){
      cls+=' sel';
    }
    h+=`<div class="${cls}" onclick="pickOpt('${q.id}',${j})"><span class="ltr">${ABCD[j]}.</span>${opt[lang]||opt['zh-TW']}</div>`;
  });
  // Explanation
  if(p&&q.exp){
    h+=`<div class="exp-box"><strong>💡 ${t('expT')}:</strong> ${q.exp[lang]||q.exp['zh-TW']||''}</div>`;
  }
  h+=`</div>`;
  // Navigation
  h+=`<div class="qnav">`;
  if(i>0)h+=`<button class="btn btn-o btn-s" onclick="goQ(${i-1})">← ${t('prev')}</button>`;
  else h+=`<div></div>`;
  if(S.mode==='exam'&&i===qs.length-1){
    h+=`<button class="btn btn-p btn-s" onclick="submitExam()">${t('submit')}</button>`;
  }else if(i<qs.length-1){
    h+=`<button class="btn btn-p btn-s" onclick="goQ(${i+1})">${t('next')} →</button>`;
  }else{
    h+=`<button class="btn btn-p btn-s" onclick="showResults()">${t('done')}</button>`;
  }
  h+=`</div>`;
  return h;
}

function renderResults(){
  const qs=S.curQ,lang=S.lang;
  let corCnt=0;
  qs.forEach(q=>{if(S.done[q.id]&&S.done[q.id].ok)corCnt++});
  const pct=Math.round(corCnt/qs.length*100);
  const passed=pct>=60;
  let h=`<button class="back" onclick="nav('home')">← ${t('back')}</button>`;
  h+=`<div class="card center">`;
  h+=`<div style="font-size:14px;color:var(--text2)">${S.mode==='exam'?(S.examType==='A'?t('partA'):t('partB')):t('practice')}</div>`;
  h+=`<div class="score ${passed?'p':'f'}">${pct}%</div>`;
  h+=`<div style="font-size:18px;font-weight:700;color:${passed?'var(--ok)':'var(--bad)'}">${passed?t('pass'):t('fail')}</div>`;
  h+=`<div style="margin-top:8px;font-size:15px">${corCnt}/${qs.length} ${t('ok')}</div>`;
  h+=`</div>`;
  // Wrong answers
  const wrongs=qs.filter(q=>S.done[q.id]&&!S.done[q.id].ok);
  if(wrongs.length){
    h+=`<div class="card"><div class="card-t">${t('bad')} (${wrongs.length})</div>`;
    wrongs.forEach(q=>{
      const d=S.done[q.id];
      h+=`<div class="ri bad-r"><div style="font-size:14px;margin-bottom:4px">${q.q[lang]||q.q['zh-TW']}</div>`;
      h+=`<div style="font-size:13px"><span style="color:var(--bad)">✗ ${ABCD[d.sel]}. ${q.o[d.sel][lang]||q.o[d.sel]['zh-TW']}</span><br>`;
      h+=`<span style="color:var(--ok)">✓ ${ABCD[q.a]}. ${q.o[q.a][lang]||q.o[q.a]['zh-TW']}</span></div>`;
      if(q.exp)h+=`<div style="font-size:12px;color:var(--text2);margin-top:4px">💡 ${q.exp[lang]||q.exp['zh-TW']||''}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`<button class="btn btn-o btn-b" onclick="nav('home')" style="margin-top:8px">${t('back')}</button>`;
  return h;
}

function renderReview(){
  const p=S.prog,lang=S.lang;
  const wrongKeys=Object.keys(p).filter(k=>p[k].attempts&&p[k].correct/p[k].attempts<1);
  let h=`<button class="back" onclick="nav('home')">← ${t('back')}</button>`;
  if(!wrongKeys.length){
    h+=`<div class="card center"><div style="font-size:40px;margin-bottom:8px">🎉</div>${t('noBad')}</div>`;
    return h;
  }
  h+=`<div class="card"><div class="card-t">${t('review')} (${wrongKeys.length})</div></div>`;
  // Collect wrong questions
  const wQ=wrongKeys.map(k=>S.allQ.find(q=>q.id===k)).filter(Boolean);
  h+=`<button class="btn btn-p btn-b mb-16" onclick="startReviewPractice()">${t('reP')} (${wQ.length})</button>`;
  wQ.forEach(q=>{
    h+=`<div class="ri bad-r"><span class="tag tag-ch" style="margin-bottom:4px">${CH[q.ch]?CH[q.ch][lang]:q.ch}</span>`;
    h+=`<div style="font-size:14px;margin-top:4px">${q.q[lang]||q.q['zh-TW']}</div>`;
    h+=`<div style="font-size:13px;color:var(--ok);margin-top:2px">✓ ${ABCD[q.a]}. ${q.o[q.a][lang]||q.o[q.a]['zh-TW']}</div>`;
    h+=`</div>`;
  });
  return h;
}

function renderInfo(){
  const lang=S.lang;
  let h=`<button class="back" onclick="nav('home')">← ${t('back')}</button>`;
  h+=`<div class="card"><div class="card-t">⚓ ${t('examR')}</div>`;
  h+=`<div class="info-row">📋 ${t('rA')}</div>`;
  h+=`<div class="info-row">📋 ${t('rB')}</div>`;
  h+=`<div class="info-row">📋 ${t('rC')}</div>`;
  h+=`<div class="info-row">💻 ${t('rD')}</div>`;
  h+=`<div class="info-row">📝 ${t('rE')}</div>`;
  h+=`<div class="info-row"><a href="https://www.peak.edu.hk" target="_blank" rel="noopener" style="color:var(--pri)">🔗 ${t('peak')}</a></div>`;
  h+=`</div>`;
  // Stats
  const p=S.prog;
  let totAns=0,totCor=0;
  for(const k in p){if(p[k].attempts){totAns+=p[k].attempts;totCor+=p[k].correct}}
  h+=`<div class="card"><div class="card-t">${t('prog')}</div>`;
  h+=`<div class="stats">`;
  h+=`<div><div class="sn">${totAns}</div><div class="sl">${t('sAns')}</div></div>`;
  h+=`<div><div class="sn">${totCor}</div><div class="sl">${t('sCor')}</div></div>`;
  h+=`<div><div class="sn">${S.allQ.length}</div><div class="sl">${t('total')}</div></div>`;
  h+=`</div></div>`;
  return h;
}

// ===================== ACTIONS =====================
function nav(v){
  if(S.examTmr){clearInterval(S.examTmr);S.examTmr=null}
  S.view=v;S.mode='practice';render();
}

function exitPractice(){
  if(S.examTmr){clearInterval(S.examTmr);S.examTmr=null}
  S.view=S.mode==='exam'?'examSel':'chSel';
  S.mode='practice';render();
}

function startPractice(ch){
  S.mode='practice';S.pracCh=ch;S.ans={};S.done={};S.idx=0;
  let qs=ch==='all'?[...S.allQ]:S.allQ.filter(q=>q.ch===ch);
  shuffle(qs);
  S.curQ=qs;S.view='q';render();
}

function startExam(type){
  S.mode='exam';S.examType=type;S.ans={};S.done={};S.idx=0;
  const isA=type==='A';
  const chRange=isA?['ch1','ch2','ch3','ch4','ch5','ch6','ch7','ch8','ch9','ch10','ch11','ch12','ch13']:
    ['ch14','ch15','ch16','ch17','ch18','ch19','ch20','ch21','ch22'];
  let pool=S.allQ.filter(q=>chRange.includes(q.ch));
  shuffle(pool);
  S.curQ=pool.slice(0,40);
  S.examLeft=EXAM_SEC;
  S.view='q';
  render();
  startTimer();
}

function startTimer(){
  if(S.examTmr)clearInterval(S.examTmr);
  S.examTmr=setInterval(()=>{
    S.examLeft--;
    const el=document.getElementById('timer');
    if(el){el.textContent=fmt(S.examLeft);if(S.examLeft<=300)el.classList.add('warn')}
    if(S.examLeft<=0){clearInterval(S.examTmr);S.examTmr=null;alert(t('exTime'));submitExam()}
  },1000);
}

function pickOpt(qid,idx){
  if(S.done[qid])return;
  const q=S.allQ.find(x=>x.id===qid);
  if(!q)return;
  // Practice mode: immediate feedback, locked
  if(S.mode==='practice'){
    if(S.done[qid])return;
    const ok=idx===q.a;
    S.done[qid]={sel:idx,ok};
    if(!S.prog[qid])S.prog[qid]={attempts:0,correct:0};
    S.prog[qid].attempts++;
    if(ok)S.prog[qid].correct++;
    saveProg();
  }else{
    // Exam mode: allow re-selection
    S.ans[qid]=idx;
  }
  render();
}

function goQ(i){S.idx=i;render()}

function submitExam(){
  if(S.examTmr){clearInterval(S.examTmr);S.examTmr=null}
  // Mark all unanswered as wrong
  S.curQ.forEach(q=>{
    if(!S.done[q.id]){
      const sel=S.ans[q.id];
      if(sel!==undefined){
        S.done[q.id]={sel,ok:sel===q.a};
      }else{
        S.done[q.id]={sel:-1,ok:false};
      }
      // Save progress
      if(!S.prog[q.id])S.prog[q.id]={attempts:0,correct:0};
      S.prog[q.id].attempts++;
      if(S.done[q.id].ok)S.prog[q.id].correct++;
    }
  });
  saveProg();
  showResults();
}

function showResults(){S.view='results';render()}

function startReviewPractice(){
  const p=S.prog;
  const wrongKeys=Object.keys(p).filter(k=>p[k].attempts&&p[k].correct/p[k].attempts<1);
  const wQ=wrongKeys.map(k=>S.allQ.find(q=>q.id===k)).filter(Boolean);
  if(!wQ.length)return;
  S.mode='practice';S.pracCh='review';S.ans={};S.done={};S.idx=0;
  S.curQ=[...wQ];shuffle(S.curQ);S.view='q';render();
}

function changeLang(lang){
  S.lang=lang;
  localStorage.setItem('pvoc_lang',lang);
  document.documentElement.lang=lang;
  render();
}

function toggleTheme(){
  S.theme=S.theme==='dark'?'light':'dark';
  localStorage.setItem('pvoc_theme',S.theme);
  applyTheme();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme',S.theme);
  document.getElementById('themeBtn').textContent=S.theme==='dark'?'☀️':'🌙';
}

// ===================== INIT =====================
async function init(){
  try{
  applyTheme();
  document.documentElement.lang=S.lang;
  document.getElementById('langSel').addEventListener('change',e=>changeLang(e.target.value));
  document.getElementById('main').innerHTML=`<div class="loading"><div class="spin"></div><div>${t('loading')}</div></div>`;
  await loadData();
  render();
  }catch(e){document.getElementById('main').innerHTML='<div class="card"><p>⚠️ Error: '+e.message+'</p></div>';console.error(e);}
}
init();
</script>
